kind = "mobile"
previewPath = "/"
title = "ExpenseBuddy"
version = "1.0.0"
id = "artifacts/expense-buddy"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24241

[services.development]
run = "pnpm --filter @workspace/expense-buddy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/expense-buddy", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/expense-buddy", "run", "serve" ]

[services.env]
PORT = "24241"
BASE_PATH = "/"
